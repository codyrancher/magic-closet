# Rancher server. Reachable as https://rancher from other services and
# https://localhost:${RANCHER_PORT} from the host.
services:
  rancher:
    image: rancher/rancher:${RANCHER_TAG:-head}
    profiles: ["rancher"]
    privileged: true
    # Stable node identity so a DinD restart/recreate keeps the same ip + name.
    # Rancher's embedded k3s (etcd) pins its peer url to the node ip and its node
    # name to the hostname; if either changes the apiserver crash-loops. The
    # static ip needs the fixed subnet defined in compose.stack.yml (networks:).
    hostname: rancher
    networks:
      default:
        ipv4_address: 172.28.0.10
    env_file:
      - path: ${MC_ENV_FILE:-./.env}
        required: false
    environment:
      # Generated at init into .state/secrets.env (not .env) — never set by hand
      - CATTLE_BOOTSTRAP_PASSWORD=${RANCHER_BOOTSTRAP_PASSWORD:-}
      # Rancher Prime: when RANCHER_PRIME is non-empty these become
      # prime/suse; empty otherwise
      - RANCHER_VERSION_TYPE=${RANCHER_PRIME:+prime}
      - CATTLE_BASE_UI_BRAND=${RANCHER_PRIME:+suse}
    ports:
      - "${RANCHER_PORT:-8344}:443"
    volumes:
      - rancher-data:/var/lib/rancher
      - ./workspace/shared:/shared:ro
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/ping"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

volumes:
  rancher-data:
