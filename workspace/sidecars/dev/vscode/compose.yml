# VS Code in the browser (openvscode-server). A thin editor: it edits the same
# ./workspace the closet container runs and shares the closet's toolchain (node
# via the `toolchain` volume; gh/claude/mc via the tools mount) instead of
# baking its own. Use `mc run "<cmd>"` to run in the closet container.
services:
  vscode:
    image: magic-closet-vscode
    build: ./workspace/sidecars/dev/vscode
    profiles: ["vscode"]
    env_file:
      - path: ${MC_ENV_FILE:-./.env}
        required: false
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # The api runs in the root container now — reach it via the DinD bridge
      # gateway (host-gateway extra_host below), not the old `api` service DNS.
      - MC_API_URL=http://host.docker.internal:${API_PORT:-8300}
      - GH_TOKEN=${GH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host port is HTTPS (the TLS proxy on 9443) — a secure context so VS Code
      # web webviews work. 9000 stays http for in-network use + the healthcheck.
      - "${VSCODE_PORT:-8310}:9443"
    volumes:
      - ${MC_WORKSPACE:-/magic-closet-data/workspace}:/workspace
      - ./workspace/shared:/shared:ro
      # Node + nvm + Claude creds: the root container populates these under the
      # data dir; bind the same host dirs so the editor shares node + login.
      - ${MC_DATA_DIR:-/magic-closet-data}/toolchain:/opt/toolchain
      - vscode-data:/data
      - ${MC_DATA_DIR:-/magic-closet-data}/claude-data:/claude-data
      # Rancher UI extension source
      - ./rancher-extension:/rancher-extension
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  vscode-data:
