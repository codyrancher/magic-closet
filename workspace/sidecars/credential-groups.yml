# Credential groups shown on the closet "Secret Set" page.
#
# The credential FIELDS are declared per-sidecar (each sidecar.yml `credentials:`
# list) and deduped by key; this file supplies the GROUP definitions (order +
# a description of how the group's values are used) and any `core` credentials
# the closet itself uses that don't belong to a single sidecar.
#
# The extension bakes all of this into pkg/magic-closet/credentials.generated.ts
# at build time via scripts/gen-credentials.mjs — nothing here is read at runtime.

# Group order + description (rendered as the section header + subtext).
groups:
  GitHub:
    description: Authenticates git operations in the workspace (private repos, higher rate limits).
  Figma:
    description: Access token for the Figma MCP server, so agents can read designs.
  Application Collection:
    description: SUSE Application Collection login, used to add its chart repo in Rancher.
  AWS:
    description: Credentials for provisioning AWS clusters (EC2 nodes / EKS) from the browser command menu.
  Azure:
    description: Service-principal credentials for provisioning AKS clusters from the browser command menu.
  GCP:
    description: Service-account key for provisioning GKE clusters from the browser command menu.

# Credentials used by the closet workspace itself (not owned by a sidecar).
core:
  - key: ghToken
    label: GitHub token
    group: GitHub
    usage: clones private rancher/dashboard PRs & repos
