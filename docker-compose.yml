name: magic-closet

# The whole magic-closet stack runs INSIDE this single privileged
# docker-in-docker container instead of creating a pile of containers on the
# host. The host sees one container ("magic-closet"); everything else (project,
# api, vscode, rancher, keycloak, ...) is a NESTED container managed by the api.
# The actual stack is defined in compose.stack.yml and brought up by
# dind-entrypoint.sh once the inner dockerd is ready.
#
#   docker compose up -d                    # start the DinD (first run builds the stack inside)
#   docker compose logs -f                  # dockerd + inner "compose up" progress
#   docker exec -it magic-closet sh         # shell into the DinD; `docker ps` shows the nested stack
#   docker compose down                     # stop everything (nested data kept in the mc-docker volume)
#   docker compose down -v                  # also wipe the nested docker data
services:
  magic-closet:
    image: docker:27-dind
    container_name: magic-closet
    privileged: true                        # required to run an inner dockerd
    environment:
      - DOCKER_TLS_CERTDIR=                  # inner dockerd on the unix socket, no TLS
    working_dir: /magic-closet
    entrypoint: ["/bin/sh", "/magic-closet/dind-entrypoint.sh"]
    volumes:
      - .:/magic-closet                     # the repo — live edits to api/, sidecars/, workspace/, .env keep working
      - mc-docker:/var/lib/docker           # nested docker images/volumes survive restarts
    ports:
      # ${*_PORT} resolve from ./.env (auto-loaded), so host overrides still apply.
      # Each maps host -> DinD; the inner stack then publishes the same port inside.
      - "${API_PORT:-8300}:${API_PORT:-8300}"
      - "${API_HTTPS_PORT:-8301}:${API_HTTPS_PORT:-8301}"
      - "${DEV_PORT:-8305}:${DEV_PORT:-8305}"
      - "${VSCODE_PORT:-8310}:${VSCODE_PORT:-8310}"
      - "${RANCHER_BROWSER_PORT:-8320}:${RANCHER_BROWSER_PORT:-8320}"
      - "${KEYCLOAK_PORT:-8330}:${KEYCLOAK_PORT:-8330}"
      - "${OPENLDAP_PORT:-8340}:${OPENLDAP_PORT:-8340}"
      - "${FIGMA_PORT:-8360}:${FIGMA_PORT:-8360}"
      - "${RANCHER_PORT:-8444}:${RANCHER_PORT:-8444}"
      # Provisioned closets grab ports from 8500 up — 20 exposed for host access
      - "8500-8519:8500-8519"
    restart: unless-stopped

volumes:
  mc-docker:
