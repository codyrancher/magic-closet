name: magic-closet

# ONE privileged container is the whole thing: it's the docker-in-docker host,
# the workspace dev environment (your code, node, claude, the `mc` CLI), AND the
# control-plane api. Only the optional SIDECARS (vscode, rancher, keycloak, ...)
# are nested containers, defined in compose.stack.yml and brought up by
# dind-entrypoint.sh once the inner dockerd is ready.
#
#   docker compose up -d                    # start it (first run builds the image + inner stack)
#   docker compose logs -f                  # dockerd + inner "compose up" progress
#   docker exec -it magic-closet bash       # shell in (as root); `su - node` for the dev user
#   docker compose down                     # stop (nested data kept in the mc-docker volume)
#   docker compose down -v                  # also wipe the nested docker data
#
# VS Code: Dev Containers -> Attach to Running Container -> magic-closet (lands
# you in as `node`, where /workspace + claude + mc live). No extra setup.
services:
  magic-closet:
    build: .                                # the root image (Dockerfile): dind + toolchain + api
    image: magic-closet
    container_name: magic-closet
    privileged: true                        # required to run an inner dockerd
    environment:
      # Runtime/instance state (.state, workspace, toolchain, claude-data) lives
      # in a sibling dir, not the source tree — mounted below.
      - MC_DATA_DIR=/magic-closet-data
    working_dir: /magic-closet
    entrypoint: ["/bin/bash", "/magic-closet/dind-entrypoint.sh"]
    volumes:
      - .:/magic-closet                     # the repo — live edits to api/, sidecars/, workspace/, .env keep working
      - ../instance/magic-closet:/magic-closet-data  # runtime/instance state (workspace, toolchain, claude-data, .state)
      - mc-docker:/var/lib/docker           # nested docker images/volumes survive restarts
    ports:
      # Every port derives from API_PORT (default 8300) — publish the whole
      # 8300-8399 block so any derived (or overridden) port is reachable without
      # the wrapper needing the exact values. The api itself listens on API_PORT
      # (8300); sidecars publish their derived ports into this range. Keep
      # API_PORT within ~8300-8339 so the derived ports stay in range.
      - "8300-8399:8300-8399"
    restart: unless-stopped

volumes:
  mc-docker:
