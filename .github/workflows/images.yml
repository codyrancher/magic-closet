name: Build container images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The root image: dind host + workspace toolchain + api (the compose
          # deployment builds this locally, but build it here to catch breakage).
          - name: root
            context: .
            dockerfile: Dockerfile
          # The api image is still used by the k8s/helm path (its own pod).
          - name: api
            context: .
            dockerfile: workspace/api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/codyrancher/magic-closet-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/codyrancher/magic-closet
