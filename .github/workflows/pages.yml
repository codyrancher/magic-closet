name: Build extension to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - name: Install
        working-directory: rancher-extension
        run: yarn install --frozen-lockfile

      - name: Build extension package
        working-directory: rancher-extension
        run: yarn build-pkg magic-closet

      - name: Fetch previous catalog (preserves older versions)
        run: |
          mkdir site
          # publish-pkgs requires a local gh-pages ref to exist
          if git fetch origin gh-pages; then
            git branch -f gh-pages FETCH_HEAD
            git archive FETCH_HEAD | tar -x -C site
          else
            git branch gh-pages
          fi

      - name: Build extension catalog (Helm repo for Rancher's extension repositories)
        working-directory: rancher-extension
        run: yarn publish-pkgs -s ${{ github.repository }} -b gh-pages

      - name: Package closet chart into the catalog
        run: |
          helm package rancher-extension/charts/closet -d rancher-extension/assets/closet
          helm repo index rancher-extension/assets --url assets/ --merge rancher-extension/assets/index.yaml

      - name: Assemble site
        run: |
          cp -r rancher-extension/dist-pkg/* site/
          for d in assets charts extensions; do
            [ -d "rancher-extension/$d" ] && cp -r "rancher-extension/$d" site/
          done
          # publish-pkgs writes the freshly merged index to assets/index.yaml;
          # the root index.yaml it leaves behind is the previous (wget'd) one
          if [ -f rancher-extension/assets/index.yaml ]; then
            cp rancher-extension/assets/index.yaml site/index.yaml
          elif [ -f rancher-extension/index.yaml ]; then
            cp rancher-extension/index.yaml site/index.yaml
          fi
          cp workspace/api/src/logo.svg site/logo.svg
          touch site/.nojekyll
          {
            echo '<!doctype html><meta charset="utf-8"><title>magic-closet extension</title>'
            echo '<h1>magic-closet Rancher extension</h1>'
            echo '<p><b>Extension repository</b> (Rancher &rarr; Extensions &rarr; &#8942; &rarr; Manage Repositories &rarr; Create):</p>'
            echo '<pre>https://codyrancher.github.io/magic-closet/</pre>'
            echo '<p>Or Developer Load a bundle directly:</p><ul>'
            (cd site && find . -name '*.umd.min.js' -not -path './extensions/*' | sed 's|^\./||' | sort | while read -r f; do
              echo "<li><a href=\"$f\">$f</a></li>"
            done)
            echo '</ul>'
          } > site/index.html

      - name: Publish to the pages branch (additive — never clobbers sibling extensions)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Defaults keep the standalone-repo behavior: publish at the root of
          # gh-pages. For the move to a shared repo (e.g. rancher/ui-internal-tools,
          # where sibling extensions live under ai/*), set PAGES_PREFIX to this
          # extension's subdir (e.g. ai/magic-closet) — the publish then replaces
          # only that subtree and leaves siblings untouched — and PAGES_BRANCH to
          # the shared catalog branch. NB: the "Fetch previous catalog" step above
          # reads the branch root; when you set PAGES_PREFIX, point that fetch at
          # the same subdir so the Helm index merge still sees prior versions.
          PAGES_BRANCH: gh-pages
          PAGES_PREFIX: ''
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf pages-branch
          # Check out the existing branch so we build ON TOP of it (never replace it
          # wholesale); start an orphan branch only if it doesn't exist yet.
          if ! git clone --depth 1 --branch "$PAGES_BRANCH" "$REMOTE" pages-branch 2>/dev/null; then
            git clone --depth 1 "$REMOTE" pages-branch
            ( cd pages-branch && git checkout --orphan "$PAGES_BRANCH" && git reset -q \
              && find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} + )
          fi
          ( cd pages-branch
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com" )
          # Lay our freshly built site down. With a prefix, replace ONLY our subtree
          # (so a stale removed file doesn't linger); without one, union-copy at root.
          if [ -n "$PAGES_PREFIX" ]; then
            rm -rf "pages-branch/$PAGES_PREFIX"
            mkdir -p "pages-branch/$PAGES_PREFIX"
            cp -r site/. "pages-branch/$PAGES_PREFIX/"
          else
            cp -r site/. pages-branch/
          fi
          ( cd pages-branch
            git add -A
            if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
            git commit -q -m "Publish ${PAGES_PREFIX:-magic-closet} extension catalog"
            # Plain push (no --force). Retry with a rebase in case a sibling
            # extension pushed to the same branch while we were building.
            for i in 1 2 3 4 5; do
              if git push -q origin "$PAGES_BRANCH"; then exit 0; fi
              echo "push rejected — fetching + rebasing, then retrying ($i/5)"
              git fetch -q origin "$PAGES_BRANCH"
              git rebase -q FETCH_HEAD
            done
            echo "failed to push after retries" >&2; exit 1 )
