name: magic-closet

# Each sidecar lives in its own directory under sidecars/ and ships its own
# compose fragment. Adding a sidecar = create the directory + list it here.
include:
  - path: sidecars/dev/vscode/compose.yml
    project_directory: .
  - path: sidecars/dev/rancher-browser/compose.yml
    project_directory: .
  - path: sidecars/dev/rancher/compose.yml
    project_directory: .
  - path: sidecars/design/figma/compose.yml
    project_directory: .
  - path: sidecars/auth/keycloak/compose.yml
    project_directory: .
  - path: sidecars/auth/openldap/compose.yml
    project_directory: .

services:
  # Main container: holds the source code, node (via nvm), and the CLI toolchain.
  # Everything else is an optional sidecar. The vscode sidecar shares this
  # container's toolchain (the `toolchain` volume) instead of baking its own.
  closet:
    image: magic-closet-closet
    build: ./closet
    # Params live in .env (env_file below) and are injected into every
    # container, so any argument passed to one sidecar is visible to all.
    # Generated login secrets are NOT here — they live in .state/secrets.env
    # and reach containers via ${*_PASSWORD} interpolation (dind-entrypoint.sh
    # exports them; the api adds it as a second --env-file).
    env_file:
      - path: ${MC_ENV_FILE:-./.env}
        required: false
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MC_API_URL=http://api:8080
    ports:
      # Dev server (vite etc.) — run it on 0.0.0.0:8005 inside the container
      - "${DEV_PORT:-8305}:8005"
    volumes:
      - ${MC_WORKSPACE:-./workspace}:/workspace
      - ./tools:/opt/magic-closet/tools
      - claude-data:/claude-data
      # Node + nvm, shared with the (slim) vscode sidecar
      - toolchain:/opt/toolchain
      # Rancher UI extension source — built with the closet container's node
      - ./extension:/extension
    restart: unless-stopped

  # Sidecar control plane: start/stop/delete sidecars over HTTP.
  api:
    image: magic-closet-api
    build:
      context: .
      dockerfile: closet/api/Dockerfile
    environment:
      # Host path of this repo — needed so compose commands issued through the
      # host docker socket resolve bind mounts correctly.
      - MC_ROOT=${PWD}
      # Which closet this api manages (compose project + env file)
      - MC_PROJECT=${MC_PROJECT:-magic-closet}
      - MC_ENV_FILE=${MC_ENV_FILE:-.env}
      # The stack lives in a non-default file so the host's docker-compose.yml
      # can be the DinD wrapper; the api drives compose with this file.
      - MC_COMPOSE_FILE=${MC_COMPOSE_FILE:-compose.stack.yml}
    working_dir: ${PWD}
    ports:
      - "${API_PORT:-8300}:8080"
      - "${API_HTTPS_PORT:-8301}:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    restart: unless-stopped

volumes:
  claude-data:
  # nvm + node, populated by the closet container and shared with vscode
  toolchain:
