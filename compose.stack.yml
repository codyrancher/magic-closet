name: magic-closet

# The SIDECARS. The workspace dev environment and the control-plane api used to
# be services here too, but they now live in the root "magic-closet" container
# itself (see ../Dockerfile + dind-entrypoint.sh) — only sidecars stay nested.
# Each sidecar lives in its own directory under sidecars/ and ships its own
# compose fragment. Adding a sidecar = create the directory + list it here.
include:
  - path: workspace/sidecars/dev/vscode/compose.yml
    project_directory: .
  - path: workspace/sidecars/dev/rancher-browser/compose.yml
    project_directory: .
  - path: workspace/sidecars/dev/rancher/compose.yml
    project_directory: .
  - path: workspace/sidecars/design/figma/compose.yml
    project_directory: .
  - path: workspace/sidecars/auth/keycloak/compose.yml
    project_directory: .
  - path: workspace/sidecars/auth/openldap/compose.yml
    project_directory: .

networks:
  # Fixed subnet so key services can hold a STATIC ip across DinD restarts.
  # Without this, an inner-dockerd restart (e.g. the outer container being
  # recreated) hands out new ips, which breaks Rancher's embedded k3s/etcd —
  # etcd pins its peer url to the node ip, so a changed ip crash-loops the
  # apiserver. Rancher pins itself to a static ip below (rancher/compose.yml).
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
