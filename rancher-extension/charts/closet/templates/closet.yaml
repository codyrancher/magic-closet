apiVersion: apps/v1
kind: Deployment
metadata:
  name: closet
  labels: { app: closet }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: closet }
  template:
    metadata:
      labels: { app: closet }
    spec:
      containers:
        - name: closet
          image: {{ .Values.images.closet }}
          imagePullPolicy: Always
          envFrom:
            - secretRef: { name: closet-secrets }
            - configMapRef: { name: closet-config }
          ports:
            - containerPort: 8005
          # Run a tiny sshd on 127.0.0.1:2222 so VS Code Remote-SSH can attach
          # to /workspace via a `kubectl exec … nc` ProxyCommand (no exposed
          # port). Host key + authorized_keys live on the persistent /workspace
          # volume, so it survives restarts; the closet detail page hands out a
          # one-liner that injects the user's key.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    set +e
                    export DEBIAN_FRONTEND=noninteractive
                    if ! command -v sshd >/dev/null || ! command -v nc >/dev/null; then
                      apt-get update -qq && apt-get install -y -qq openssh-server netcat-openbsd
                    fi
                    mkdir -p /run/sshd /workspace/.mc-ssh && chmod 700 /workspace/.mc-ssh
                    [ -f /workspace/.mc-ssh/host_ed25519 ] || ssh-keygen -t ed25519 -N '' -f /workspace/.mc-ssh/host_ed25519 -q
                    touch /workspace/.mc-ssh/authorized_keys && chmod 600 /workspace/.mc-ssh/authorized_keys
                    printf 'Port 2222\nListenAddress 127.0.0.1\nHostKey /workspace/.mc-ssh/host_ed25519\nPermitRootLogin prohibit-password\nAuthorizedKeysFile /workspace/.mc-ssh/authorized_keys\nUsePAM no\nStrictModes no\n' > /etc/ssh/sshd_config_vscode
                    pgrep -x sshd >/dev/null || /usr/sbin/sshd -f /etc/ssh/sshd_config_vscode
                    exit 0
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: claude-data, mountPath: /claude-data }
      volumes:
        - name: workspace
{{- if eq .Values.storage.mode "pvc" }}
          persistentVolumeClaim: { claimName: workspace }
{{- else }}
          hostPath:
            path: {{ .Values.storage.hostPathBase }}/{{ .Release.Namespace }}/workspace
            type: DirectoryOrCreate
{{- end }}
        - name: claude-data
{{- if eq .Values.storage.mode "pvc" }}
          persistentVolumeClaim: { claimName: claude-data }
{{- else }}
          hostPath:
            path: {{ .Values.storage.hostPathBase }}/{{ .Release.Namespace }}/claude-data
            type: DirectoryOrCreate
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: closet
spec:
  selector: { app: closet }
  ports:
    - { name: dev, port: 8005, targetPort: 8005 }
